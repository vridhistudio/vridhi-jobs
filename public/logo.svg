<svg width="120" height="120" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vg" x1="5" y1="13" x2="37" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>
  <!--
    Asymmetric V mark for Vridhi Studio.
    Left arm starts at (5,13), vertex at (20,35), right arm ends at (37,5).
    Right endpoint is 8 units higher than left — intentional growth indicator.
    Stroke-based, not a letterform. Distinctive from symmetric V logos.
  -->
  <path
    d="M5 13 L20 35 L37 5"
    stroke="url(#vg)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
